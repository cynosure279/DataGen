name: CI

"on":
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  #############################################################################
  # Rust: test + clippy across OS × toolchain matrix
  #############################################################################
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, nightly]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}

      - name: Install Linux deps (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: cargo test --workspace
        run: cargo test --workspace --all-features

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-features -- -D warnings

  #############################################################################
  # Frontend: lint + test (Node / pnpm)
  #############################################################################
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm test
        run: |
          if find src -name "*.test.*" -o -name "*.spec.*" 2>/dev/null | grep -q .; then
            pnpm test
          else
            echo "No test files found, skipping"
          fi

  #############################################################################
  # TypeScript type-check (vue-tsc)
  #############################################################################
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: vue-tsc typecheck
        run: npx vue-tsc --noEmit

  #############################################################################
  # Debian package: build .deb + structure/metadata validation +
  # lintian error gate + install/uninstall smoke
  #############################################################################
  deb-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-deb-smoke

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Tauri Linux build deps + lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            dpkg \
            lintian

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build .deb bundle
        run: pnpm tauri build --bundles deb

      - name: Discover .deb artifact
        run: |
          DEB="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          if [ -z "$DEB" ]; then
            echo "::error::No .deb artifact found under target/release/bundle/deb"
            exit 1
          fi
          echo "DEB=$DEB" >> "$GITHUB_ENV"
          echo "Discovered deb artifact: $DEB"

      - name: Validate deb structure and metadata (dpkg-deb)
        run: |
          file "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          # Package name is derived from the artifact itself (productName "DataGen"
          # produces package "data-gen"), not hardcoded.
          PKG="$(dpkg-deb -f "$DEB" Package)"
          if [ -z "$PKG" ]; then
            echo "::error::deb is missing the Package field"
            exit 1
          fi
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "Package name: $PKG"
          # Tauri deb depends (gcc/g++/python3) must be reflected in metadata
          dpkg-deb -f "$DEB" Depends | grep -qw gcc
          dpkg-deb -f "$DEB" Depends | grep -qw 'g++'
          dpkg-deb -f "$DEB" Depends | grep -qw python3

      - name: Lintian (errors fail the gate)
        run: |
          lintian --fail-on error --info "$DEB"

      - name: Install / uninstall smoke
        run: |
          sudo dpkg -i "$DEB"
          dpkg -s "$PKG" >/dev/null
          BIN="$(dpkg -L "$PKG" | grep '^/usr/bin/' | head -n 1)"
          if [ -z "$BIN" ]; then
            echo "::error::installed package exposes no binary under /usr/bin"
            exit 1
          fi
          if [ ! -x "$BIN" ]; then
            echo "::error::installed binary $BIN is not executable"
            exit 1
          fi
          echo "Installed $PKG; binary present and executable: $BIN"
          sudo dpkg -r "$PKG"
          if [ -e "$BIN" ]; then
            echo "::error::binary still present after package removal"
            exit 1
          fi
          echo "deb smoke passed: install, structure/metadata, lintian (errors only), uninstall"
