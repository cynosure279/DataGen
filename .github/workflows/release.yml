name: Release

"on":
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  #############################################################################
  # Build: Linux (Tauri desktop)
  #############################################################################
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build (release)
        run: cargo build --release -p datagen-desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: datagen-desktop-linux
          path: target/release/datagen-desktop
          if-no-files-found: error

  #############################################################################
  # Build: macOS (Tauri desktop)
  #############################################################################
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release -p datagen-desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: datagen-desktop-macos
          path: target/release/datagen-desktop
          if-no-files-found: error

  #############################################################################
  # Build: Windows (Tauri desktop)
  #############################################################################
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release -p datagen-desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: datagen-desktop-windows
          path: target/release/datagen-desktop.exe
          if-no-files-found: error

  #############################################################################
  # Build: Web (Docker image)
  #############################################################################
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/datagen-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker image (tar)
        run: |
          docker save -o /tmp/datagen-server.tar \
            ghcr.io/${{ github.repository }}/datagen-server:${{ steps.meta.outputs.version }}

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: datagen-server-docker
          path: /tmp/datagen-server.tar
          if-no-files-found: error

  #############################################################################
  # Release: aggregate all artifacts + create GitHub Release
  #############################################################################
  release:
    needs:
      - build-linux
      - build-macos
      - build-windows
      - build-web
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/datagen-desktop-linux/datagen-desktop
            artifacts/datagen-desktop-macos/datagen-desktop
            artifacts/datagen-desktop-windows/datagen-desktop.exe
            artifacts/datagen-server-docker/datagen-server.tar
          generate_release_notes: true
          draft: false
          prerelease: false