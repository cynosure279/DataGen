name: Release

"on":
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo build --release -p datagen-desktop
      - run: |
          cd target/release
          tar czf /tmp/datagen-linux.tar.gz datagen-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: datagen-linux
          path: /tmp/datagen-linux.tar.gz
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p datagen-desktop
      - run: |
          cd target/release
          tar czf /tmp/datagen-macos.tar.gz datagen-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: datagen-macos
          path: /tmp/datagen-macos.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p datagen-desktop
      - run: |
          cd target/release
          7z a /tmp/datagen-windows.zip datagen-desktop.exe
      - uses: actions/upload-artifact@v4
        with:
          name: datagen-windows
          path: /tmp/datagen-windows.zip
          if-no-files-found: error

  build-web:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/datagen-server
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          TAG="ghcr.io/${{ github.repository }}/datagen-server:${{ github.ref_name }}"
          docker pull $TAG
          docker save -o /tmp/datagen-server.tar $TAG
      - uses: actions/upload-artifact@v4
        with:
          name: datagen-server-docker
          path: /tmp/datagen-server.tar
          if-no-files-found: error

  release:
    needs: [build-linux, build-macos, build-windows, build-web]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: ls -R artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/datagen-linux/datagen-linux.tar.gz
            artifacts/datagen-macos/datagen-macos.tar.gz
            artifacts/datagen-windows/datagen-windows.zip
            artifacts/datagen-server-docker/datagen-server.tar
          generate_release_notes: true
