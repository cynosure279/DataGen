[package]
name = "datagen-core"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
rand = "0.10"
rand_distr = "0.6"
num-prime = { version = "0.5", features = ["big-int"] }
num-modular = "0.6"
num-bigint = "0.5"
petgraph = "0.7"
ecgen-rs = "0.1"
derangements = "0.2"

[dev-dependencies]
serde_json = "1"